<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Savings Plan - NYOTA Loans</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #FFD23F;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --success: #06D6A0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #F8F9FA 0%, #E8ECEF 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 28px;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .greeting {
            font-size: 16px;
            color: #666;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .savings-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            animation: fadeIn 0.6s ease-out 0.2s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            color: var(--dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E8ECEF;
        }

        #savingsOptions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            background: #f8f9fa;
            border: 2px solid #E8ECEF;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            animation: slideIn 0.4s ease-out backwards;
        }

        .radio-option:nth-child(1) { animation-delay: 0.1s; }
        .radio-option:nth-child(2) { animation-delay: 0.15s; }
        .radio-option:nth-child(3) { animation-delay: 0.2s; }
        .radio-option:nth-child(4) { animation-delay: 0.25s; }
        .radio-option:nth-child(5) { animation-delay: 0.3s; }
        .radio-option:nth-child(6) { animation-delay: 0.35s; }
        .radio-option:nth-child(7) { animation-delay: 0.4s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .radio-option:hover {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.05);
            transform: translateX(5px);
        }

        .radio-option.selected {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(255, 210, 63, 0.1));
            border-color: var(--primary);
            border-width: 3px;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .savings-amount {
            font-family: 'Sora', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
        }

        .loan-limit {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        .result-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        #resultLabel {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            color: var(--success);
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
        }

        #resultLabel.error {
            color: var(--primary);
        }

        .proceed-section {
            animation: fadeIn 0.6s ease-out 0.5s backwards;
        }

        #proceedBtn {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'DM Sans', sans-serif;
        }

        #proceedBtn:hover:not(:disabled) {
            background: #ff5520;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }

        #proceedBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .info-note {
            background: rgba(255, 210, 63, 0.2);
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            animation: fadeIn 0.6s ease-out 0.6s backwards;
        }

        .info-note strong {
            color: var(--dark);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .savings-amount {
                font-size: 20px;
            }

            .radio-option {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Choose Your Savings Plan</h1>
            <p class="greeting">Hello <span id="usernames"></span>select a plan to get started</p>
            <p>Save monthly and unlock your loan limit</p>
        </div>

        <div class="savings-card">
            <div class="section-title">Available Savings Plans</div>
            <div id="savingsOptions"></div>
        </div>

        <div class="result-section">
            <div id="resultLabel">Select a savings plan to see your loan limit</div>
        </div>

        <div class="proceed-section">
            <button id="proceedBtn" disabled>Proceed to Application</button>
            
            <div class="info-note">
                <strong>Note:</strong> Your loan limit is determined by your selected savings plan. Choose wisely based on your financial goals.
            </div>
        </div>
    </div>

    <script>
        //localStorage.clear();
        const name = localStorage.getItem("name") || "John Doe";
        const fname = name.split(' ')[0];
        document.getElementById("usernames").textContent = fname + ", ";
        
        function getRandomLimit(min, max) {
            // Round to nearest 10
            return Math.floor(Math.random() * (max - min + 1) + min) - (Math.floor(Math.random() * (max - min + 1) + min) % 10);
        }
        
        const plans = [
            {savings: 100, limit: getRandomLimit(3500, 4500)},
            {savings: 165, limit: getRandomLimit(5000, 7500)},
            {savings: 210, limit: getRandomLimit(8000, 10500)},
            {savings: 275, limit: getRandomLimit(11000, 13500)},
            {savings: 320, limit: getRandomLimit(14000, 16000)},
            {savings: 575, limit: getRandomLimit(25000, 30500)},
            {savings: 680, limit: getRandomLimit(37000, 42000)}
        ];
        
        const savingsOptions = document.getElementById('savingsOptions');
        const resultLabel = document.getElementById('resultLabel');
        const proceedBtn = document.getElementById('proceedBtn');
        let selectedOption = null;
        
        plans.forEach(plan => {
            const option = document.createElement('label');
            option.className = 'radio-option';
            option.innerHTML = `
                <input type="radio" name="savings" value="${plan.savings}">
                <div class="savings-amount">Ksh ${plan.savings.toLocaleString()}</div>
                <div class="loan-limit">Loan limit: Ksh ${plan.limit.toLocaleString()}</div>
            `;
            savingsOptions.appendChild(option);
        });
        
        document.querySelectorAll('input[name="savings"]').forEach(input => {
            input.addEventListener('change', (e) => {
                document.querySelectorAll('.radio-option').forEach(opt => 
                    opt.classList.remove('selected'));
                e.target.closest('.radio-option').classList.add('selected');
                
                selectedOption = plans.find(p => p.savings === Number(e.target.value));
                
                if (selectedOption.savings === 575) {
                    resultLabel.textContent = 'Only existing members allowed';
                    resultLabel.classList.add('error');
                    proceedBtn.disabled = true;
                } else {
                    resultLabel.textContent = `Your loan limit: Ksh ${selectedOption.limit.toLocaleString()}`;
                    resultLabel.classList.remove('error');
                    proceedBtn.disabled = false;
                }
            });
        });
        
        proceedBtn.addEventListener('click', () => {
            if (selectedOption) {
                localStorage.setItem('limit', selectedOption.limit);
                window.location.href = 'Verification.html';
            }
        });
    </script>
</body>
</html>
